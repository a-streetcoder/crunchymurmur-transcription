[package]
name = "tauri-plugin-crunchymurmur-transcribe"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Tauri 2 desktop adapter for the CrunchyMurmur on-device transcription engine"
repository = "https://github.com/a-streetcoder/crunchymurmur-transcription"
homepage = "https://github.com/a-streetcoder/crunchymurmur-transcription/tree/main/packages/transcribe-tauri"
readme = "README.md"
keywords = ["transcription", "speech-to-text", "on-device", "tauri"]
categories = ["multimedia::audio"]
links = "tauri-plugin-crunchymurmur-transcribe"

[lib]
crate-type = ["lib"]

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }

[dependencies]
crunchymurmur-transcriber = { version = "=0.1.0-alpha.1", path = "../../native/transcriber" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11.5", default-features = false }
tempfile = "3"
